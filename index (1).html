<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>สนุกกับการบวก–ลบเศษส่วน ป.3</title>
<style>
  :root{
    --bg1:#fff7fb; --bg2:#eef9ff; --card:#ffffff; --text:#263238;
    --pink:#ff7eb6; --pink2:#ffd1e6; --blue:#61c9ff; --yellow:#ffd45c;
    --green:#73d69c; --purple:#a88bff; --red:#ff6b6b; --shadow:0 12px 30px rgba(70,70,120,.16);
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:"Tahoma","Noto Sans Thai",sans-serif; color:var(--text);
    background:linear-gradient(135deg,var(--bg1),var(--bg2)); min-height:100vh;
  }
  .wrap{max-width:1100px;margin:auto;padding:18px}
  .hero{
    background:linear-gradient(135deg,#fff,#fff9fd); border:3px solid #fff;
    border-radius:26px; box-shadow:var(--shadow); padding:20px; text-align:center;
    position:relative; overflow:hidden;
  }
  .hero:before,.hero:after{content:"";position:absolute;border-radius:50%;opacity:.22}
  .hero:before{width:180px;height:180px;background:#ffd45c;right:-55px;top:-70px}
  .hero:after{width:150px;height:150px;background:#61c9ff;left:-50px;bottom:-75px}
  h1{margin:0;font-size:clamp(28px,5vw,54px);color:#ff5fa2;line-height:1.2}
  .subtitle{font-size:clamp(18px,2.5vw,28px);margin:8px 0 0;font-weight:700}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}
  button,select,input{min-height:48px;font-size:20px;border-radius:14px}
  button{border:0;padding:10px 18px;font-weight:800;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.09)}
  button:active{transform:translateY(2px);box-shadow:0 3px 0 rgba(0,0,0,.09)}
  .btn-op{background:#fff;border:3px solid #d8e8f3;color:#345}
  .btn-op.active{background:linear-gradient(135deg,#61c9ff,#8fddff);color:#fff;border-color:#fff}
  .btn-sound{background:#fff3c4}
  .btn-answer{background:linear-gradient(135deg,#ff7eb6,#ff5fa2);color:#fff;font-size:24px;padding:12px 26px}
  .btn-reset{background:#e9f7ef;color:#238a55}

  .main-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
  .panel{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:18px;border:2px solid #fff}
  .panel h2{margin:0 0 12px;font-size:clamp(22px,3vw,30px);color:#5661c6}
  .fraction-card{background:linear-gradient(180deg,#ffffff,#fbfdff);border:2px dashed #d6e7f4;border-radius:20px;padding:16px}
  .inputs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
  .frac-input{display:grid;grid-template-rows:auto 4px auto;gap:7px;max-width:160px;margin:auto}
  .frac-input input{width:100%;text-align:center;border:2px solid #bcd9ec;background:#fafeff;font-weight:800;padding:5px}
  .bar{height:4px;background:#455a64;border-radius:10px}
  .symbol{font-size:42px;font-weight:900;color:#ff6b6b}
  .visual-select{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0 6px}
  .visual-select button{background:#fff;border:3px solid #eee;font-size:20px}
  .visual-select button.active{border-color:#ffb0d0;background:#fff3f8}

  .food-stage{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;margin-top:12px}
  .food-box{text-align:center}
  .food-label{font-size:20px;font-weight:800;margin-bottom:8px}
  canvas.food{width:min(100%,330px);aspect-ratio:1/1;background:transparent;border-radius:24px}

  .result-panel{margin-top:18px;text-align:center;background:linear-gradient(135deg,#fff,#fff5fb);border:3px solid #ffd6e7}
  .result-title{font-size:clamp(22px,3vw,32px);font-weight:900;color:#ff5fa2}
  .result{min-height:120px;display:flex;align-items:center;justify-content:center;margin-top:10px}
  .result-frac{display:inline-grid;grid-template-rows:auto 5px auto;gap:8px;font-weight:900;font-size:clamp(42px,8vw,78px);color:#37474f;min-width:110px}
  .result-frac .line{height:5px;background:#37474f;border-radius:10px}
  .hint{font-size:18px;color:#607d8b;margin-top:8px;font-weight:700}
  .error{color:#d84343;font-size:20px;font-weight:800;padding:12px}

  .spark{position:fixed;pointer-events:none;font-size:26px;animation:pop 1100ms ease-out forwards;z-index:9999}
  @keyframes pop{0%{transform:translateY(0) scale(.5) rotate(0);opacity:1}100%{transform:translateY(-180px) scale(1.4) rotate(240deg);opacity:0}}
  .bounce{animation:bounce .45s ease}
  @keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

  @media(max-width:760px){
    .main-grid{grid-template-columns:1fr}
    .food-stage{grid-template-columns:1fr 1fr}
    .inputs{grid-template-columns:1fr auto 1fr}
    .panel{padding:14px}
  }
  @media(max-width:480px){
    .food-stage{grid-template-columns:1fr}
    .symbol{font-size:34px}
    button,select,input{font-size:18px}
  }
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <h1>🍕🎂 สนุกกับการบวก–ลบเศษส่วน 🎂🍕</h1>
    <div class="subtitle">เลือกเครื่องหมาย ใส่เศษส่วน แล้วดูภาพและคำตอบได้เลย</div>
    <div class="toolbar">
      <button id="addBtn" class="btn-op active" aria-label="เลือกการบวก">➕ การบวก</button>
      <button id="subBtn" class="btn-op" aria-label="เลือกการลบ">➖ การลบ</button>
      <button id="soundBtn" class="btn-sound" aria-label="เปิดปิดเสียง">🔊 เสียง: เปิด</button>
    </div>
  </section>

  <section class="main-grid">
    <div class="panel">
      <h2>1) ใส่เศษส่วน</h2>
      <div class="fraction-card">
        <div class="inputs">
          <div class="frac-input">
            <input id="n1" type="number" min="0" value="1" aria-label="ตัวเศษจำนวนที่หนึ่ง">
            <div class="bar"></div>
            <input id="d1" type="number" min="1" value="4" aria-label="ตัวส่วนจำนวนที่หนึ่ง">
          </div>
          <div id="opSymbol" class="symbol">+</div>
          <div class="frac-input">
            <input id="n2" type="number" min="0" value="2" aria-label="ตัวเศษจำนวนที่สอง">
            <div class="bar"></div>
            <input id="d2" type="number" min="1" value="4" aria-label="ตัวส่วนจำนวนที่สอง">
          </div>
        </div>
        <div class="visual-select">
          <button id="pizzaBtn" class="active">🍕 พิซซ่า</button>
          <button id="cakeBtn">🎂 เค้ก</button>
        </div>
      </div>
    </div>

    <div class="panel">
      <h2>2) ภาพเศษส่วนของเรา</h2>
      <div class="food-stage">
        <div class="food-box">
          <div class="food-label">เศษส่วนที่ 1</div>
          <canvas id="food1" class="food" width="420" height="420"></canvas>
        </div>
        <div class="food-box">
          <div class="food-label">เศษส่วนที่ 2</div>
          <canvas id="food2" class="food" width="420" height="420"></canvas>
        </div>
      </div>
    </div>
  </section>

  <section class="panel result-panel">
    <div class="result-title">3) กดดูผลลัพธ์</div>
    <div class="toolbar">
      <button id="answerBtn" class="btn-answer">✨ ดูคำตอบ ✨</button>
      <button id="resetBtn" class="btn-reset">🔄 เริ่มใหม่</button>
    </div>
    <div id="result" class="result"><div class="hint">คำตอบจะขึ้นเป็นเศษส่วนเท่านั้น</div></div>
  </section>
</div>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const state = { op: '+', food: 'pizza', sound: true, locked: false };
  const els = {
    n1:$('n1'),d1:$('d1'),n2:$('n2'),d2:$('d2'),opSymbol:$('opSymbol'),
    addBtn:$('addBtn'),subBtn:$('subBtn'),pizzaBtn:$('pizzaBtn'),cakeBtn:$('cakeBtn'),
    answerBtn:$('answerBtn'),resetBtn:$('resetBtn'),soundBtn:$('soundBtn'),result:$('result'),
    food1:$('food1'),food2:$('food2')
  };

  function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){[a,b]=[b,a%b]} return a||1; }
  function simplify(n,d){
    if(d===0) return null;
    if(d<0){n=-n;d=-d;}
    const g=gcd(n,d); return [n/g,d/g];
  }

  function readFraction(nEl,dEl){
    const n=Number(nEl.value), d=Number(dEl.value);
    if(!Number.isInteger(n)||!Number.isInteger(d)||d<=0||n<0) return null;
    if(d>24) return {error:'เพื่อให้ภาพแบ่งส่วนอ่านง่าย ตัวส่วนควรไม่เกิน 24'};
    return {n,d};
  }

  function setLocked(v){
    state.locked=v;
    [els.addBtn,els.subBtn,els.pizzaBtn,els.cakeBtn,els.answerBtn,els.resetBtn,els.n1,els.d1,els.n2,els.d2].forEach(x=>x.disabled=v);
  }

  function beep(kind='win'){
    if(!state.sound) return;
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      const ctx=new AC(); const now=ctx.currentTime;
      const notes= kind==='win' ? [523,659,784,1047] : [220,180];
      notes.forEach((freq,i)=>{
        const osc=ctx.createOscillator(), gain=ctx.createGain();
        osc.type= kind==='win' ? 'triangle':'sawtooth'; osc.frequency.value=freq;
        gain.gain.setValueAtTime(0.0001,now+i*.1);
        gain.gain.exponentialRampToValueAtTime(.18,now+i*.1+.02);
        gain.gain.exponentialRampToValueAtTime(.0001,now+i*.1+.16);
        osc.connect(gain).connect(ctx.destination); osc.start(now+i*.1); osc.stop(now+i*.1+.18);
      });
      setTimeout(()=>ctx.close(),900);
    }catch(e){}
  }

  function confetti(){
    const icons=['⭐','✨','🎉','💖','🍕','🎂','🌈'];
    for(let i=0;i<20;i++){
      const s=document.createElement('span'); s.className='spark'; s.textContent=icons[Math.floor(Math.random()*icons.length)];
      s.style.left=(10+Math.random()*80)+'vw'; s.style.top=(60+Math.random()*25)+'vh';
      s.style.animationDelay=(Math.random()*.18)+'s'; document.body.appendChild(s);
      setTimeout(()=>s.remove(),1400);
    }
  }

  function drawFood(canvas,n,d,kind){
    const ctx=canvas.getContext('2d'), W=canvas.width, H=canvas.height, cx=W/2, cy=H/2;
    ctx.clearRect(0,0,W,H);
    const r=150; const selected=Math.max(0,Math.min(n,d));
    // plate/shadow
    ctx.save(); ctx.globalAlpha=.13; ctx.fillStyle='#718096'; ctx.beginPath();ctx.ellipse(cx,cy+16,r+35,r+22,0,0,Math.PI*2);ctx.fill();ctx.restore();
    ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(cx,cy,r+26,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#dfeef6';ctx.lineWidth=8;ctx.stroke();

    const start=-Math.PI/2;
    for(let i=0;i<d;i++){
      const a1=start+i*2*Math.PI/d, a2=start+(i+1)*2*Math.PI/d;
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,a1,a2);ctx.closePath();
      if(kind==='pizza') ctx.fillStyle=i<selected?'#ffcf55':'#fff4cf';
      else ctx.fillStyle=i<selected?'#ff9fc6':'#ffe1ed';
      ctx.fill(); ctx.strokeStyle=kind==='pizza'?'#d98a2b':'#d875a1';ctx.lineWidth=4;ctx.stroke();
    }
    if(kind==='pizza'){
      // crust
      ctx.strokeStyle='#c9792d';ctx.lineWidth=20;ctx.beginPath();ctx.arc(cx,cy,r-4,0,Math.PI*2);ctx.stroke();
      ctx.strokeStyle='#f5b04b';ctx.lineWidth=11;ctx.beginPath();ctx.arc(cx,cy,r-4,0,Math.PI*2);ctx.stroke();
      // toppings only on selected area-ish random deterministic positions
      const pts=[[-58,-62],[36,-72],[70,-20],[-78,18],[-22,62],[55,61],[5,-16],[-50,52],[78,36]];
      pts.forEach((p,idx)=>{
        const ang=Math.atan2(p[1],p[0]); let norm=(ang-start+Math.PI*2)%(Math.PI*2); const seg=Math.floor(norm/(2*Math.PI/d));
        if(seg<selected){
          ctx.fillStyle='#e94b4b';ctx.beginPath();ctx.arc(cx+p[0],cy+p[1],12,0,Math.PI*2);ctx.fill();
          ctx.fillStyle='#fff0a6';ctx.beginPath();ctx.arc(cx+p[0]-3,cy+p[1]-3,3,0,Math.PI*2);ctx.fill();
        }
      });
      // cheese dots
      ctx.fillStyle='#fff6b5';[[20,28],[-30,-28],[52,8],[-5,-83]].forEach(p=>{ctx.beginPath();ctx.arc(cx+p[0],cy+p[1],5,0,Math.PI*2);ctx.fill();});
    } else {
      // cake icing rim and sprinkles
      ctx.strokeStyle='#f47fb0';ctx.lineWidth=14;ctx.beginPath();ctx.arc(cx,cy,r-5,0,Math.PI*2);ctx.stroke();
      const spr=[[-70,-35],[-25,-85],[38,-70],[78,-25],[62,45],[12,78],[-48,64],[-82,15],[0,-25],[30,25],[-35,25]];
      const colors=['#ffcc4d','#61c9ff','#8cd790','#a88bff','#ff6b6b'];
      spr.forEach((p,i)=>{
        const ang=Math.atan2(p[1],p[0]); let norm=(ang-start+Math.PI*2)%(Math.PI*2); const seg=Math.floor(norm/(2*Math.PI/d));
        if(seg<selected){ctx.save();ctx.translate(cx+p[0],cy+p[1]);ctx.rotate((i%4)*.5);ctx.fillStyle=colors[i%colors.length];ctx.fillRect(-4,-10,8,20);ctx.restore();}
      });
      // cherry
      if(selected>0){ctx.fillStyle='#e9445b';ctx.beginPath();ctx.arc(cx,cy-105,16,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#388e3c';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(cx+2,cy-120);ctx.quadraticCurveTo(cx+18,cy-145,cx+30,cy-138);ctx.stroke();}
    }

    // fraction badge
    ctx.fillStyle='#ffffff';ctx.strokeStyle='#cfe5f3';ctx.lineWidth=4;ctx.beginPath();ctx.roundRect(cx-54,H-72,108,52,18);ctx.fill();ctx.stroke();
    ctx.fillStyle='#37474f';ctx.font='bold 28px Tahoma';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(n+'/'+d,cx,H-46);
  }

  function updateVisuals(){
    const f1=readFraction(els.n1,els.d1), f2=readFraction(els.n2,els.d2);
    if(f1 && !f1.error) drawFood(els.food1,f1.n,f1.d,state.food); else drawFood(els.food1,0,4,state.food);
    if(f2 && !f2.error) drawFood(els.food2,f2.n,f2.d,state.food); else drawFood(els.food2,0,4,state.food);
    els.result.innerHTML='<div class="hint">คำตอบจะขึ้นเป็นเศษส่วนเท่านั้น</div>';
  }

  function setOp(op){ if(state.locked)return; state.op=op; els.opSymbol.textContent=op; els.addBtn.classList.toggle('active',op==='+'); els.subBtn.classList.toggle('active',op==='-'); els.result.innerHTML='<div class="hint">คำตอบจะขึ้นเป็นเศษส่วนเท่านั้น</div>'; }
  function setFood(kind){ if(state.locked)return; state.food=kind; els.pizzaBtn.classList.toggle('active',kind==='pizza'); els.cakeBtn.classList.toggle('active',kind==='cake'); updateVisuals(); }

  function showError(msg){els.result.innerHTML='<div class="error">⚠️ '+msg+'</div>';beep('bad');}
  function answer(){
    if(state.locked)return;
    const a=readFraction(els.n1,els.d1), b=readFraction(els.n2,els.d2);
    if(!a||!b) return showError('กรุณาใส่ตัวเศษเป็นจำนวนเต็มตั้งแต่ 0 ขึ้นไป และตัวส่วนตั้งแต่ 1 ขึ้นไป');
    if(a.error) return showError(a.error); if(b.error) return showError(b.error);
    let num,den;
    if(state.op==='+'){num=a.n*b.d+b.n*a.d;den=a.d*b.d;} else {num=a.n*b.d-b.n*a.d;den=a.d*b.d;}
    const s=simplify(num,den); if(!s) return showError('ไม่สามารถคำนวณได้');
    setLocked(true);
    els.result.innerHTML=`<div id="answerFrac" class="result-frac"><div>${s[0]}</div><div class="line"></div><div>${s[1]}</div></div>`;
    const af=$('answerFrac'); af.classList.add('bounce'); confetti(); beep('win');
    setTimeout(()=>setLocked(false),700);
  }

  els.addBtn.addEventListener('click',()=>setOp('+'));
  els.subBtn.addEventListener('click',()=>setOp('-'));
  els.pizzaBtn.addEventListener('click',()=>setFood('pizza'));
  els.cakeBtn.addEventListener('click',()=>setFood('cake'));
  els.answerBtn.addEventListener('click',answer);
  els.resetBtn.addEventListener('click',()=>{if(state.locked)return;els.n1.value=1;els.d1.value=4;els.n2.value=2;els.d2.value=4;setOp('+');setFood('pizza');updateVisuals();});
  els.soundBtn.addEventListener('click',()=>{state.sound=!state.sound;els.soundBtn.textContent=state.sound?'🔊 เสียง: เปิด':'🔇 เสียง: ปิด';});
  [els.n1,els.d1,els.n2,els.d2].forEach(el=>{el.addEventListener('input',()=>{if(!state.locked)updateVisuals();});});
  updateVisuals();
})();
</script>
</body>
</html>
